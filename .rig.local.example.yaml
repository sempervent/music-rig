# Copy to `.rig.local.yaml` (gitignored) and fill machine-local paths.
# Never commit absolute paths or secrets into canonical data/*.yaml.
# Null means "not configured on this machine."

paths:
  backup_root: null
  pfl_jam_ableton_set: null
  obs_export: null
  stream_deck_export: null
  kaoss_backup: null
  controller_mappings_export: null

# Prefer: `uv run rig agent provider setup`
# agent:
#   provider: cursor          # or ollama | command
#   fallback: null            # optional: ollama
#   timeout_seconds: 120
#   cursor:
#     executable: null        # default: agent
#     model: null             # Cursor default when unset
#   ollama:
#     base_url: http://127.0.0.1:11434
#     model: qwen3.5:latest
#   # Advanced only:
#   # provider: command
#   # argv: [/path/to/wrapper]
