site_name: Music Rig
site_url: https://sempervent.github.io/music-rig/
site_description: Living documentation for the home studio routing, pedals, MIDI, and recording setup.
repo_name: sempervent/music-rig
repo_url: https://github.com/sempervent/music-rig
theme:
  name: material
  features:
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - content.code.copy
plugins:
  - search
nav:
  - Home: index.md
  - Current Routing: current-routing.md
  - Inventory: inventory.md
  - Patchbays: patchbays.md
  - Pedal Chains: pedal-chains.md
  - TASCAM Channel Map: tascam-channel-map.md
  - Alesis Mixer Map: alesis-mixer-map.md
  - Todo: todo.md
  - Wishlist: wishlist.md
  - Ableton Track Map: ableton-track-map.md
  - Controller Mappings: controller-mappings.md
  - Performance: performance.md
  - Live Recovery: live-recovery.md
  - Backups: backups.md
  - Automation readiness: automation-readiness.md
  - MIDI Topology: midi-topology.md
  - MIDI Clock: midi-clock.md
  - Reamp and DI: reamp-and-di.md
  - Troubleshooting: troubleshooting.md
  - Open Questions: open-questions.md
  - Operational readiness: operational-readiness.md
  - Known-good ops: known-good-ops.md
  - Jam now: jam-now.md
  - Human handoff: human-handoff.md
  - Stage 25 live validation: stage-25-live-validation.md
  - Interactive TUI: tui.md
  - Reconciliation: reconciliation.md
  - Testing: testing.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
