[project]
name = "music-rig"
version = "0.1.0"
description = "Planning CLI and documentation tooling for the music-rig studio repository."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "rich>=13.9,<15",
    "textual>=8.2.8",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.16,<8",
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1,<8",
    "pytest-xdist>=3.6,<4",
]
docs = [
    "mkdocs>=1.6,<1.7",
    "mkdocs-material>=9.6,<10",
]

[project.scripts]
rig = "music_rig.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_rig"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# pytest-asyncio: auto-detect `async def test_*` / async fixtures (no sync wrappers).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = [
    "-n",
    "auto",
    "--cov=music_rig",
    "--cov-report=term-missing:skip-covered",
]
# -n auto → pytest_xdist_auto_num_workers in tests/conftest.py → max(1, cpu_count - 2)
# Enforce --cov-fail-under=75 on the full suite (CI + local validation below).
# Subset / debug: uv run pytest path -n0 --cov-fail-under=0
markers = [
    "unit: fast isolated unit tests",
    "integration: service/CLI/TUI workflows on fixture repos",
    "smoke: thin production-readonly or CLI surface checks",
]
filterwarnings = [
    # Intentional Textual Header defect probe
    # (tests/integration/tui/test_textual_header_defect.py)
    "ignore:coroutine 'Header._on_mount.<locals>.set_title' was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = ["music_rig"]
# Thin Typer wiring + Textual UI are exercised separately; gate service/domain coverage.
omit = [
    "*/music_rig/cli.py",
    "*/music_rig/tui/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
