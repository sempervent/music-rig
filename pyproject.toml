[project]
name = "music-rig"
version = "0.1.0"
description = "Planning CLI and documentation tooling for the music-rig studio repository."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "rich>=13.9,<15",
    "textual>=8.2.8",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.16,<8",
    "pre-commit>=4,<5",
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1,<8",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.11,<1",
    "ryl>=0.1",
]
docs = [
    "mkdocs>=1.6,<1.7",
    "mkdocs-material>=9.6,<10",
]

[project.scripts]
rig = "music_rig.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_rig"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# pytest-asyncio: auto-detect `async def test_*` / async fixtures (no sync wrappers).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = [
    "-n",
    "auto",
    "--cov=music_rig",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]
# -n auto → pytest_xdist_auto_num_workers in tests/conftest.py → max(1, cpu_count - 2)
# Full suite enforces 80% coverage via --cov-fail-under=80 (CI + local validation).
# Subset / debug: uv run pytest path -n0 --cov-fail-under=0
markers = [
    "unit: fast isolated unit tests",
    "integration: service/CLI/TUI workflows on fixture repos",
    "smoke: thin production-readonly or CLI surface checks",
]
filterwarnings = [
    # Intentional Textual Header defect probe
    # (tests/integration/tui/test_textual_header_defect.py)
    "ignore:coroutine 'Header._on_mount.<locals>.set_title' was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = ["music_rig"]
# Thin Typer wiring + Textual UI are exercised separately; gate service/domain coverage.
omit = [
    "*/music_rig/cli.py",
    "*/music_rig/tui/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["site", ".venv", "assets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ryl enables no rules by default; explicit enable/disable below.
[tool.ryl.files]
yaml = ["*.yaml", "*.yml", ".pre-commit-config.yaml"]

[tool.ryl.rules]
anchors = "enable"
braces = "enable"
brackets = "enable"
colons = "enable"
commas = "enable"
document-end = "disable"
document-start = "disable"
empty-lines = "enable"
hyphens = "enable"
key-duplicates = "enable"
key-ordering = "disable"
new-line-at-end-of-file = "enable"
new-lines = "enable"
trailing-spaces = "enable"
quoted-strings = "disable"
octal-values = "disable"
float-values = "disable"
empty-values = "disable"

# Repo YAML uses flush list markers under keys; do not force indent-sequences rewrites.
[tool.ryl.rules.indentation]
indent-sequences = "whatever"

[tool.ryl.rules.line-length]
max = 120
allow-non-breakable-words = true
allow-non-breakable-inline-mappings = true

[tool.ryl.rules.comments]
level = "warning"

[tool.ryl.rules.comments-indentation]
level = "warning"

[tool.ryl.rules.truthy]
level = "warning"
check-keys = false
allowed-values = ["true", "false", "on"]
