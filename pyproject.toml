[project]
name = "music-rig"
version = "0.1.0"
description = "Planning CLI and documentation tooling for the music-rig studio repository."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "rich>=13.9,<15",
    "textual>=8.2.8",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.4.0",
]
docs = [
    "mkdocs>=1.6,<1.7",
    "mkdocs-material>=9.6,<10",
]

[project.scripts]
rig = "music_rig.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_rig"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
