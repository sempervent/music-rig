# Physical patchbay jack map.
# Upper jack N pairs with lower jack N+24. Mode is normal/half-normal/thru when known.
# Do not infer normalled signal flow from rear connections alone.

schema_notes:
  jack_fields:
  - row: upper | lower
  - connection: free-text device/port label, or null if unassigned/undocumented
  - device: optional structured device name
  - port: optional structured port name
  - direction: optional (source | destination | bidirectional | unknown)
  - paired_with: paired jack number on the other row
  - mode: normal | half-normal | thru | unknown
  - status: documented | unassigned | undocumented
  - notes: free text
