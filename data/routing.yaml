# High-level CURRENT routes. Pedal detail: docs/pedal-chains.md. Patchbays: data/patchbays.yaml.
# named_paths: structured CLI CURRENT topology (canonical for path mutations / projections).
# Do not infer CURRENT updates from freeform changes or inbox notes.
routes:
  clean_mixer_capture:
    status: CURRENT
    from: Alesis Main Out
    to: TASCAM 1/2
  kaoss_capture:
    status: CURRENT
    from: TASCAM OUT 3/4
    through: KAOSS Replay
    to: TASCAM IN 15/16
    notes: 'HUMAN Stage 23 correction: TASCAM OUT 3/4 feeds KAOSS Replay; KAOSS returns to
      TASCAM IN 15/16. TASCAM IN 3/4 remain miniKORG capture (do not confuse OUT vs IN). Supersedes
      Monitor Out → TASCAM 9/10.'
  aux_send_loop:
    status: CURRENT
    from: Alesis AUX SEND
    chain:
    - BOSS RC-1
    - Cry Baby
    - JOYO A/B/Bypass
    - DIRTY (Send A) or SPACE (Send B)
    - BOSS CH-1 stereo out
    to: Alesis Return 1 and 2
    notes: RC-1 ahead of wah/JOYO so captured phrases can be manipulated by downstream pedals.
      JOYO path is mono until CH-1. Return jacks confirmed Q-003.
  miniKORG_direct:
    status: CURRENT
    from: miniKORG stereo out
    to: TASCAM 3/4
    via_patchbay: PB-B
  acoustic_clean:
    status: CURRENT
    from: Acoustic instrument
    through:
    - BOSS acoustic preamp
    - A/B/Y clean leg
    to: TASCAM 5
    other_aby_leg: Alesis 2
  bass_clean:
    status: CURRENT
    from: Bass
    through:
    - BBox preamp
    - A/B/Y clean leg
    to: TASCAM 6
    other_aby_leg: Alesis 1
  electric_guitar_clean:
    status: CURRENT
    from: Electric guitar
    through:
    - Flamma preamp
    - A/B/Y clean leg
    to: TASCAM 7
    other_aby_leg: Alesis 3
  sr18_direct:
    status: CURRENT
    from: Alesis SR-18 MAIN L/R
    to: TASCAM 11/12
    via_patchbay: PB-B
named_paths:
  aux:
    label: AUX SEND wet loop
    status: CURRENT
    route_ref: aux_send_loop
    notes: 'A = DIRTY (see: rig path show dirty); B = SPACE (see: rig path show space). JOYO
      path is mono until CH-1.'
    branches:
      main:
        label: Main path
        nodes:
        - id: alesis-aux-send
          label: Alesis AUX SEND
          kind: endpoint
        - id: rc-1
          label: BOSS RC-1
          gear_ref: boss-rc-1
          kind: device
        - id: cry-baby
          label: Cry Baby
          gear_ref: cry-baby
          kind: device
        - id: joyo
          label: JOYO A/B/Bypass
          note: A = DIRTY (rig path show dirty); B = SPACE (rig path show space)
          gear_ref: joyo-ab-bypass
          kind: device
        - id: ch-1
          label: BOSS CH-1 stereo out
          signal: stereo
          gear_ref: boss-ch-1
          kind: device
        - id: alesis-return-1-2
          label: Alesis Return 1 and 2
        position: before
      joyo-a:
        label: 'A = DIRTY (see: rig path show dirty)'
        nodes: []
        attach: joyo
        position: before
      joyo-b:
        label: 'B = SPACE (see: rig path show space)'
        nodes: []
        attach: joyo
        position: before
  dirty:
    label: JOYO DIRTY — Send A
    status: CURRENT
    branches:
      main:
        label: DIRTY chain
        nodes:
        - id: joyo-send-a
          label: JOYO SEND A
          kind: endpoint
        - id: od-1
          label: BOSS OD-1
          gear_ref: boss-od-1
          kind: device
        - id: bd-2
          label: BOSS BD-2
          gear_ref: boss-bd-2
          kind: device
        - id: jb-2
          label: BOSS JB-2
          gear_ref: boss-jb-2
          kind: device
        - id: mt-2w
          label: BOSS MT-2w
          gear_ref: boss-mt-2w
          kind: device
        - id: ds-1
          label: BOSS DS-1
          gear_ref: boss-ds-1
          kind: device
        - id: joyo-return-a
          label: JOYO RETURN A
          kind: endpoint
  space:
    label: JOYO SPACE — Send B
    status: CURRENT
    branches:
      main:
        label: Main path
        nodes:
        - id: joyo-send-b
          label: JOYO SEND B
          kind: endpoint
        - id: sy-1
          label: SY-1
          gear_ref: boss-sy-1
          kind: device
        - id: ls-2
          label: LS-2
          mode: A+B MIX ↔ BYPASS
          gear_ref: boss-ls-2
          kind: device
        - id: joyo-return-b
          label: JOYO RETURN B
          kind: endpoint
      sy1-send:
        label: SY-1 SEND loop
        attach: sy-1
        position: before
        nodes:
        - id: ph-3
          label: PH-3
          gear_ref: boss-ph-3
          kind: device
        - id: tr-2
          label: TR-2
          gear_ref: boss-tr-2
          kind: device
        - id: sy1-return
          label: SY-1 RETURN
          kind: endpoint
      ls2-a:
        label: LS-2 Loop A
        attach: ls-2
        position: before
        nodes:
        - id: sl-2
          label: SL-2
          gear_ref: boss-sl-2
          kind: device
        - id: dd-8
          label: DD-8
          gear_ref: boss-dd-8
          kind: device
      ls2-b:
        label: LS-2 Loop B
        attach: ls-2
        position: before
        nodes:
        - id: te-2
          label: TE-2
          gear_ref: boss-te-2
          kind: device
        - id: re-2
          label: RE-2
          gear_ref: boss-re-2
          kind: device
  kaoss:
    label: KAOSS Replay monitor/sample path
    status: CURRENT
    route_ref: kaoss_capture
    branches:
      main:
        label: Main path
        nodes:
        - id: tascam-out-3-4
          label: TASCAM OUT 3/4
        - id: kaoss-replay
          label: KAOSS Replay
          gear_ref: kaoss-replay
          kind: device
        - id: tascam-in-15-16
          label: TASCAM IN 15/16
        position: before
  clean_mixer:
    label: Clean mixer capture
    status: CURRENT
    route_ref: clean_mixer_capture
    branches:
      main:
        label: Main path
        nodes:
        - id: alesis-main
          label: Alesis Main Out
          kind: endpoint
        - id: tascam-1-2
          label: TASCAM 1/2
          gear_ref: tascam-us-16x08
          kind: device
  acoustic:
    label: Acoustic clean capture
    status: CURRENT
    route_ref: acoustic_clean
    branches:
      main:
        label: Main path
        nodes:
        - id: acoustic-in
          label: Acoustic instrument
          gear_ref: acoustic-instrument
          kind: device
        - id: boss-acoustic-preamp
          label: BOSS acoustic preamp
          gear_ref: boss-acoustic-preamp
          kind: device
        - id: aby-clean
          label: A/B/Y clean leg
          kind: endpoint
        - id: tascam-5
          label: TASCAM 5
          gear_ref: tascam-us-16x08
          kind: device
        position: before
      aby-other:
        label: other A/B/Y leg
        nodes:
        - id: alesis-2
          label: Alesis 2
        attach: boss-acoustic-preamp
        position: after
  bass:
    label: Bass clean capture
    status: CURRENT
    route_ref: bass_clean
    branches:
      main:
        label: Main path
        nodes:
        - id: bass-in
          label: Bass
          gear_ref: bass
          kind: device
        - id: bbox-preamp
          label: BBox preamp
          gear_ref: bbox-preamp
          kind: device
        - id: aby-clean
          label: A/B/Y clean leg
          kind: endpoint
        - id: tascam-6
          label: TASCAM 6
          gear_ref: tascam-us-16x08
          kind: device
        position: before
      aby-other:
        label: other A/B/Y leg
        nodes:
        - id: alesis-1
          label: Alesis 1
        attach: bbox-preamp
        position: after
  electric:
    label: Electric guitar clean capture
    status: CURRENT
    route_ref: electric_guitar_clean
    branches:
      main:
        label: Main path
        nodes:
        - id: electric-in
          label: Electric guitar
          gear_ref: electric-guitar
          kind: device
        - id: flamma-preamp
          label: Flamma preamp
          gear_ref: flamma-preamp
          kind: device
        - id: aby-clean
          label: A/B/Y clean leg
          kind: endpoint
        - id: tascam-7
          label: TASCAM 7
          gear_ref: tascam-us-16x08
          kind: device
        position: before
      aby-other:
        label: other A/B/Y leg
        nodes:
        - id: alesis-3
          label: Alesis 3
        attach: flamma-preamp
        position: after
  minikorg:
    label: miniKORG direct capture
    status: CURRENT
    route_ref: miniKORG_direct
    branches:
      main:
        label: Main path
        nodes:
        - id: minikorg-out
          label: miniKORG stereo out
          signal: stereo
          gear_ref: korg-minikorg
          kind: device
        - id: pb-b
          label: PB-B
          kind: endpoint
        - id: tascam-3-4
          label: TASCAM 3/4
          gear_ref: tascam-us-16x08
          kind: device
  sr18:
    label: SR-18 direct capture
    status: CURRENT
    route_ref: sr18_direct
    branches:
      main:
        label: Main path
        nodes:
        - id: sr18-main
          label: Alesis SR-18 MAIN L/R
          signal: stereo
          gear_ref: alesis-sr-18
          kind: device
        - id: pb-b
          label: PB-B
          kind: endpoint
        - id: tascam-11-12
          label: TASCAM 11/12
          gear_ref: tascam-us-16x08
          kind: device
