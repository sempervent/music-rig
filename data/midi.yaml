# Canonical CURRENT MIDI topology (not audio routing).
# Evidence statuses: VERIFIED | INTENDED | UNKNOWN
# Do not treat INTENDED design as VERIFIED CURRENT fact.
# Q-015 HUMAN: FCB1010 → U6MIDI Pro IN 1; U6MIDI Pro OUT 1 → Thru5 WC IN 1.
# Downstream Thru5 fan-out and other ports remain incompletely traced.
# Controller switch/knob maps are out of scope for this document (see controllers.yaml).

endpoints:
- id: ableton
  kind: software
  name: Ableton Live
- id: macbook
  kind: host
  name: MacBook
devices:
- gear_ref: cme-u6midi-pro
  role: usb-midi-router
  notes: >-
    3 in / 3 out; route / merge / filter / remap — OWNED.
    Q-015: receives FCB1010 on MIDI IN 1; sends to Thru5 WC on MIDI OUT 1.
- gear_ref: cme-midi-thru5-wc
  role: midi-thru
  notes: >-
    Hardware thru distribution — OWNED; not a programmable remapper.
    Q-015: fed from U6MIDI Pro OUT 1 into Thru5 WC IN 1; other thru ports not fully traced.
